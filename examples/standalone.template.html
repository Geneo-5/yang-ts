<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YANG browser parser example (standalone)</title>
  <body>
    <h1>Sysrepo oven: build an RPC request</h1>
    <p>This single file is a self-contained demo: the engine and the oven YANG schema are embedded, so it works when opened directly in a browser (double-click), through the VS Code Live Server extension, or from any static server. No install, no server required.</p>
    <label for="time">Insert-food timing</label>
    <select id="time"></select>
    <pre id="result" aria-live="polite"></pre>
    <script>
      "use strict";
      /*__ENGINE__*/
      const OVEN_YANG = /*__YANG__*/;
      (() => {
        const result = document.querySelector("#result");
        const fail = message => { result.textContent = message; };
        try {
          const { createFormModel, createRestconfRpcRequest, parseYang, validateFormValue } = YangEngine;
          const module = parseYang(OVEN_YANG);
          const form = createFormModel(module);
          const operation = form.operations.find(item => item.name === "insert-food");
          const field = form.fields.find(item => item.path === "/insert-food/input/time");
          if (!operation || !field || field.control !== "enum") throw new Error("Expected insert-food RPC with an enum input");

          const select = document.querySelector("#time");
          for (const option of field.options) {
            const item = document.createElement("option");
            item.value = option.value;
            item.textContent = option.label;
            if (option.description) item.title = option.description;
            select.append(item);
          }
          select.addEventListener("change", () => {
            const validation = validateFormValue(field, select.value);
            result.textContent = validation.status === "valid"
              ? JSON.stringify(createRestconfRpcRequest(operation, { time: select.value }), null, 2)
              : validation.errors.map(error => error.message).join("\n")
                || `Validation needs more schema/context: ${validation.pending.map(item => `${item.kind}: ${item.expression}`).join("; ")}`;
          });
          select.dispatchEvent(new Event("change"));
        } catch (error) {
          fail(error instanceof Error ? error.message : String(error));
        }
      })();
    </script>
  </body>
</html>

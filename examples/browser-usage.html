<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YANG browser parser example</title>
  <body>
    <h1>Sysrepo oven: inspect an RPC enum</h1>
    <p>This demo reads the oven YANG file in the browser and builds a select from the parsed AST.</p>
    <label for="time">Insert-food timing</label>
    <select id="time"></select>
    <pre id="result" aria-live="polite"></pre>
    <script type="module">
      import { childOf, childrenOf, parseYang } from "../dist/index.js";

      const response = await fetch("../tests/fixtures/yang/sysrepo/oven.yang");
      if (!response.ok) throw new Error(`Could not load oven.yang (${response.status})`);
      const module = parseYang(await response.text());
      const insertFood = childrenOf(module, "rpc").find(node => node.argument === "insert-food");
      const input = insertFood && childOf(insertFood, "input");
      const timing = input && childrenOf(input, "leaf").find(node => node.argument === "time");
      const type = timing && childOf(timing, "type");
      const options = type && childrenOf(type, "enum");
      if (!options?.length) throw new Error("Expected an enumeration on insert-food/input/time");

      const select = document.querySelector("#time");
      for (const option of options) {
        const item = document.createElement("option");
        item.value = option.argument ?? "";
        item.textContent = option.argument ?? "";
        select.append(item);
      }
      const result = document.querySelector("#result");
      select.addEventListener("change", () => { result.textContent = `Selected YANG enum: ${select.value}`; });
      select.dispatchEvent(new Event("change"));
    </script>
  </body>
</html>

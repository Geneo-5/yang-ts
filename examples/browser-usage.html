<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YANG browser parser example</title>
  <body>
    <h1>Sysrepo oven: inspect an RPC enum</h1>
    <p>This demo reads the oven YANG file in the browser and builds a select from the parsed AST.</p>
    <label for="time">Insert-food timing</label>
    <select id="time"></select>
    <pre id="result" aria-live="polite"></pre>
    <script type="module">
      import { createFormModel, parseYang, validateFormValue } from "../dist/index.js";

      const response = await fetch("../tests/fixtures/yang/sysrepo/oven.yang");
      if (!response.ok) throw new Error(`Could not load oven.yang (${response.status})`);
      const module = parseYang(await response.text());
      const form = createFormModel(module);
      const field = form.fields.find(item => item.path === "/insert-food/input/time");
      if (!field || field.control !== "enum") throw new Error("Expected an enum field at insert-food/input/time");

      const select = document.querySelector("#time");
      for (const option of field.options) {
        const item = document.createElement("option");
        item.value = option.value;
        item.textContent = option.label;
        if (option.description) item.title = option.description;
        select.append(item);
      }
      const result = document.querySelector("#result");
      select.addEventListener("change", () => {
        const validation = validateFormValue(field, select.value);
        result.textContent = validation.status === "valid"
          ? `Selected YANG enum: ${select.value}`
          : validation.errors.map(error => error.message).join("\n")
            || `Validation needs more schema/context: ${validation.pending.map(item => `${item.kind}: ${item.expression}`).join("; ")}`;
      });
      select.dispatchEvent(new Event("change"));
    </script>
  </body>
</html>
